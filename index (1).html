<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مركز تدريس العلوم</title>
<meta name="theme-color" content="#1D232C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400..700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--paper:#FAF7F0;--card:#fff;--ink:#1D232C;--ink2:#535B66;--line:#DDD5C6;--mist:#F1ECE1;
  --att:#2374C6;--tool:#7B4FD0;--part:#18874A;--pts:#B97A00;--warn:#C93A26;--m:var(--att);
  --font:"Readex Pro","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(15px,2.2vw + 8px,19px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);padding-bottom:5.6rem;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
header{padding:.6rem .8rem .2rem;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
header .chip{min-height:2.3rem;padding:0 .8rem;font-size:.9rem}
.chip{all:unset;cursor:pointer;box-sizing:border-box;min-height:2.5rem;padding:0 .95rem;border-radius:999px;display:inline-flex;align-items:center;font-weight:700;font-size:.95rem;box-shadow:inset 0 0 0 2px var(--line);background:#fff}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.chip:focus-visible,.mode:focus-visible,.st:focus-visible,.act:focus-visible{outline:3px solid #E0A21A;outline-offset:2px}
header .info{font-size:.85rem;color:var(--ink2);font-weight:600}
header .sp{flex:1}
.view{display:inline-flex;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line);background:#fff;overflow:hidden}
.view button{all:unset;cursor:pointer;padding:.5rem .85rem;font-size:.85rem;font-weight:700}
.view button.on{background:var(--ink);color:#fff}
.sticky{position:sticky;top:0;z-index:5;background:var(--paper);padding:.5rem .8rem .55rem;box-shadow:0 1px 0 var(--line)}
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem}
.mode{all:unset;cursor:pointer;box-sizing:border-box;min-height:3.6rem;border-radius:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;font-weight:700;font-size:.82rem;
  background:#fff;color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.mode svg{width:1.45rem;height:1.45rem}
.mode.on{background:var(--c);color:#fff;box-shadow:0 .2rem 0 rgba(0,0,0,.25)}
.mode[hidden]{display:none}
.sub{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem;align-items:center;min-height:2.4rem}
.sub .lbl{font-size:.82rem;color:var(--ink2);font-weight:600}
.sub .chip{min-height:2.2rem;font-size:.85rem;padding:0 .8rem}
.sub .chip.on{background:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.6rem,1fr));gap:.5rem;padding:.7rem .8rem}
.st{all:unset;cursor:pointer;box-sizing:border-box;position:relative;min-height:5.4rem;border-radius:1rem;padding:.5rem .55rem .45rem;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;gap:.3rem;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.st .nm{font-weight:700;font-size:.95rem;line-height:1.35;flex:1;padding-inline-end:1.5rem}
.st.abs{background:var(--mist);color:var(--ink2);box-shadow:inset 0 0 0 2px var(--line)}
.st.abs .nm{text-decoration:line-through;text-decoration-thickness:2px}
.st{min-width:0;overflow:hidden}
.st .bd{display:flex;flex-wrap:wrap;gap:.22rem;min-height:1.35rem;min-width:0}
.b{display:inline-flex;align-items:center;gap:.15rem;height:1.35rem;padding:0 .4rem;border-radius:.45rem;font-size:.72rem;font-weight:700;color:#fff;background:var(--c);direction:rtl;white-space:nowrap}
.b svg{width:.8rem;height:.8rem}
.b.out{background:#fff;color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.st .more{position:absolute;left:.15rem;top:.1rem;width:2rem;height:2rem;border-radius:.6rem;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.st .more svg{width:1.1rem;height:1.1rem}
.bar{position:fixed;inset-inline:0;bottom:0;z-index:6;display:flex;gap:.5rem;padding:.6rem .8rem calc(.6rem + env(safe-area-inset-bottom,0px));background:rgba(250,247,240,.96);box-shadow:0 -1px 0 var(--line)}
.act{all:unset;cursor:pointer;box-sizing:border-box;min-height:3rem;padding:0 .7rem;white-space:nowrap;border-radius:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:700;font-size:.9rem;background:#fff;box-shadow:inset 0 0 0 2px var(--ink),0 .18rem 0 var(--ink)}
.act:active{transform:translateY(.1rem);box-shadow:inset 0 0 0 2px var(--ink),0 .05rem 0 var(--ink)}
.act svg{width:1.15rem;height:1.15rem}
.act.undo{flex:1;min-width:0;justify-content:flex-start;overflow:hidden;font-size:.82rem}
.act.undo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act[disabled]{opacity:.45;pointer-events:none}
.act.dark{background:var(--ink);color:#fff;box-shadow:0 .18rem 0 #000}
.sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(29,35,44,.5)}
.sheet.on{display:flex}
.sheet .pan{width:min(46rem,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:1.4rem 1.4rem 0 0;padding:1rem 1rem 1.4rem}
.sheet h2{margin:0 0 .2rem;font-size:1.25rem}
.sheet .x{all:unset;cursor:pointer;float:left;width:2.6rem;height:2.6rem;border-radius:.8rem;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px var(--line)}
.sheet .x svg{width:1.1rem;height:1.1rem}
.sheet p{margin:.3rem 0;color:var(--ink2);font-size:.9rem;line-height:1.7}
.rowc{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.sheet input[type=text]{width:100%;font:600 1rem var(--font);padding:.7rem .8rem;border-radius:.8rem;border:2px solid var(--line);direction:rtl}
.sheet input:focus{outline:3px solid #E0A21A;border-color:var(--ink)}
.sheet h3{margin:1rem 0 .1rem;font-size:.95rem;color:var(--ink2)}
.hist{margin:0;padding:0;list-style:none;font-size:.9rem}
.hist li{padding:.4rem 0;border-top:1px solid var(--mist);display:flex;gap:.6rem;align-items:center}
.hist li.none{color:var(--ink2)}
.hist li span{flex:1}
.hist time{color:var(--ink2);direction:ltr;font-variant-numeric:tabular-nums;font-size:.82rem}
.del{all:unset;cursor:pointer;box-sizing:border-box;min-height:2.2rem;padding:0 .8rem;border-radius:.6rem;font-size:.8rem;font-weight:700;color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.del:focus-visible{outline:3px solid #E0A21A}
.box{margin:.8rem 0 .2rem;padding:.7rem .8rem .3rem;border-radius:1rem;background:#FCFBF8;box-shadow:inset 0 0 0 2px var(--mist);font-size:.9rem}
.box .rowc{margin:.45rem 0}
.chip.sm{min-height:2.2rem;padding:0 .75rem;font-size:.84rem}
.pan.full{width:min(68rem,100%);max-height:94vh}
.meta{color:var(--ink2);font-size:.84rem;margin:.2rem 0}
.seg{display:inline-flex;margin:.5rem 0 .2rem;border-radius:.8rem;box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:.5rem 1.3rem;font-weight:700;font-size:.9rem}
.seg button.on{background:var(--ink);color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;margin:.6rem 0 .7rem;font-size:.82rem;color:var(--ink2);font-weight:600}
.stats div{display:flex;align-items:baseline;gap:.35rem}
.stats b{font-size:1.5rem;direction:ltr}
.tw{overflow:auto;max-height:56vh;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
table.rp{border-collapse:separate;border-spacing:0;width:100%;font-size:.86rem}
table.rp th{position:sticky;top:0;z-index:1;background:#fff;color:var(--ink2);font-weight:700;font-size:.76rem;padding:.55rem .5rem;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
table.rp td{padding:.5rem .5rem;border-bottom:1px solid var(--mist);text-align:center;background:#fff;vertical-align:middle}
table.rp tr:nth-child(even) td{background:#FCFBF8}
table.rp th:first-child,table.rp td.n{text-align:right;position:sticky;right:0;z-index:1}
table.rp th:first-child{z-index:2}
table.rp td.n{font-weight:700;white-space:nowrap;cursor:pointer;box-shadow:inset 1px 0 0 var(--mist)}
table.rp td small{color:var(--ink2);font-size:.74rem;white-space:nowrap}
table.rp td.okc{color:#9AA1AB;font-size:.8rem}
table.rp td.hot{background:#FDECEA !important}
table.rp td.nt{text-align:right;font-size:.8rem;color:var(--ink2);min-width:9rem}
.slot{all:unset;cursor:pointer;box-sizing:border-box;min-height:3rem;padding:.3rem .9rem;border-radius:1rem;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center;line-height:1.35}
.slot b{font-size:1rem}.slot small{font-size:.72rem;opacity:.8;font-weight:600}
.bell{all:unset;cursor:pointer;box-sizing:border-box;position:relative;width:3rem;height:3rem;border-radius:1rem;display:none;align-items:center;justify-content:center;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.bell svg{width:1.4rem;height:1.4rem}
.bell i{position:absolute;top:-.3rem;left:-.3rem;min-width:1.4rem;height:1.4rem;border-radius:999px;background:var(--warn);color:#fff;font:700 .78rem var(--font);display:flex;align-items:center;justify-content:center;font-style:normal}
body:not(.board) .bell{display:flex}
.slot:focus-visible,.bell:focus-visible{outline:3px solid #E0A21A;outline-offset:2px}
.toast{position:fixed;inset-inline:.8rem;top:.8rem;z-index:30;display:none;gap:.6rem;align-items:center;padding:.7rem .9rem;border-radius:1rem;background:var(--warn);color:#fff;font-weight:700;font-size:.9rem;box-shadow:0 .6rem 1.6rem -.5rem rgba(0,0,0,.5)}
.toast.on{display:flex}
.toast.info{background:var(--att)}.toast.info button{color:var(--att)}
.tt .c.ed{background:#fff;box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.toast button{all:unset;cursor:pointer;margin-inline-start:auto;padding:.35rem .8rem;border-radius:.6rem;background:#fff;color:var(--warn);font-size:.82rem;white-space:nowrap}
.tt{display:grid;grid-template-columns:4.2rem repeat(7,1fr);gap:.25rem;font-size:.78rem;margin:.6rem 0}
.tt div,.tt button{all:unset;box-sizing:border-box;min-height:2.6rem;border-radius:.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:700}
.tt .h{color:var(--ink2);font-weight:600;font-size:.7rem}
.tt .c{background:var(--mist)}
.tt button.c{cursor:pointer;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.tt .c.now{background:var(--ink);color:#fff;box-shadow:none}
.tt .c.off{opacity:.45}
.fu{list-style:none;margin:.6rem 0;padding:0}.fu li{padding:.7rem 0;border-top:1px solid var(--mist);display:flex;gap:.6rem;align-items:center}.fu li span{flex:1}
.ctl{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;padding:.6rem .8rem 0;font-size:.84rem;color:var(--ink2);font-weight:600}
.ctl:empty{display:none}
.ctl .chip{min-height:2.3rem;padding:0 .8rem;font-size:.85rem;color:var(--ink)}
.ctl .chip.on{color:#fff}
.ctl h2{margin:0;font-size:1.3rem;color:var(--ink)}
/* ---- phone link ---- */
#qr.big{width:min(34rem,62vh)}
#scVid{display:block;width:100%;max-height:46vh;border-radius:1rem;background:#000;margin:.6rem 0}
.scst{font-weight:700;color:var(--ink) !important;font-size:1rem !important}
.ctr{text-align:center}
body.phone .lapt{display:none}
#barx:empty{display:none}#barx{display:flex}
.livech{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;min-height:2rem;padding:0 .7rem;border-radius:.6rem;font-size:.78rem;font-weight:700;color:#fff;background:#18874A}
.livech::before{content:'';width:.55rem;height:.55rem;border-radius:50%;background:#fff}
.okc{color:#18874A !important;font-weight:700}
/* ---- seating ---- */
.room{padding:.7rem .8rem}
.front{margin:0 auto .8rem;width:min(70%,24rem);text-align:center;font-weight:700;font-size:.8rem;color:#fff;background:var(--ink);border-radius:.6rem;padding:.3rem}
.rows{display:grid;gap:.8rem .7rem;grid-template-columns:repeat(var(--per),1fr)}
.desk{display:grid;gap:.25rem;grid-template-columns:repeat(var(--dc),1fr);padding:.28rem;border-radius:.9rem;background:var(--mist);min-width:0}
.desk .st{min-height:4.1rem;padding:.35rem .3rem .3rem;border-radius:.7rem}
.desk .st .nm{font-size:.76rem;padding-inline-end:0}
.ini{display:none}
@media (max-width:700px){.desk .fam{display:none}.desk .ini{display:inline}.desk .st{min-height:3.6rem;padding:.3rem .2rem}.desk .st .nm{font-size:.72rem}.rows{gap:.6rem .35rem}.desk{padding:.18rem;gap:.15rem}}
.desk .st .more{display:none}
.desk .st .b{font-size:.62rem;height:1.15rem;padding:0 .25rem}
.gh{all:unset;box-sizing:border-box;grid-column:1/-1;display:flex;align-items:center;gap:.4rem;min-height:2.3rem;padding:0 .6rem;border-radius:.6rem;background:var(--ink);color:#fff;font-weight:700;font-size:.78rem}
button.gh{cursor:pointer}
.gh span{flex:1}
.gh b{font-size:.78rem;color:#FFD98A;white-space:nowrap}
.gh i{font-style:normal;padding:.15rem .5rem;border-radius:.5rem;background:#fff;color:var(--ink);white-space:nowrap}
.gh.still{justify-content:center;background:transparent;color:var(--ink2)}
button.gh:focus-visible{outline:3px solid #E0A21A;outline-offset:2px}
@media (max-width:700px){.gh{flex-wrap:wrap;padding:.25rem .4rem;font-size:.7rem;gap:.2rem}.gh b{font-size:.7rem}}
.st.empty{background:transparent;box-shadow:none;border:2px dashed var(--line);cursor:default}
.st.pick{box-shadow:inset 0 0 0 3px var(--ink)}
.st.bad{box-shadow:inset 0 0 0 3px var(--warn);background:#FDECEA}
body.arr .sticky,body.show .sticky,body.show .bar{display:none}
body.arr .desk .st{touch-action:none;cursor:grab}
body.show{padding-bottom:1rem}
body.show .desk .st{min-height:3.4rem;justify-content:center;text-align:center}
body.show .desk .st .nm{flex:0;font-size:clamp(.78rem,1.5vw,1.25rem)}
.ghost{position:fixed;z-index:40;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg);padding:.5rem .7rem;border-radius:.8rem;background:var(--ink);color:#fff;font-weight:700;font-size:.85rem;box-shadow:0 .6rem 1.4rem -.4rem rgba(0,0,0,.5)}
.pairx{display:inline-flex;align-items:center;gap:.4rem;min-height:2.2rem;padding:0 .3rem 0 .7rem;border-radius:999px;background:#FDECEA;color:var(--warn);font-weight:700;font-size:.8rem}
.pairx button{all:unset;cursor:pointer;width:1.7rem;height:1.7rem;border-radius:50%;display:flex;align-items:center;justify-content:center}
.pairx svg{width:.9rem;height:.9rem}
#qr{display:block;margin:.8rem auto;width:min(19rem,80vw);height:auto;background:#fff;border-radius:.6rem;image-rendering:pixelated}
.board-note{display:none;margin:.5rem .8rem 0;padding:.55rem .8rem;border-radius:.8rem;background:#FFF4D6;font-size:.85rem;font-weight:600}
body.board .board-note{display:block}
@media (min-width:900px){.grid{grid-template-columns:repeat(8,1fr)}.modes{max-width:46rem}}
.room.flip .front{margin:.8rem auto 0}
.seg.sm{margin:0}.seg.sm button{padding:.4rem .9rem;font-size:.82rem}
.chip.warnon{background:var(--warn);color:#fff;box-shadow:none}
.ctl .hint{flex-basis:100%}
body.board .room{flex:1;display:flex;flex-direction:column;padding:.4rem .8rem}
body.board .room .rows{flex:1;grid-auto-rows:1fr}
body.board .desk .st{min-height:0;padding:.3rem .45rem;gap:.1rem}
body.board .room .rows{gap:.45rem .6rem}body.board .desk{padding:.2rem;gap:.2rem}body.board .room .front{margin:0 auto .45rem;padding:.2rem}body.board .desk .st .bd{min-height:1.2rem}
body.board.show .desk .st{justify-content:center}
/* the room on the board always fits one screen: rows share the height left after the controls */
body.board.room-on{height:100vh;min-height:0;overflow:hidden}
body.board.room-on .room{flex:1;min-height:0}
body.board.room-on .room .rows{min-height:0;grid-auto-rows:minmax(0,1fr)}
body.board.room-on .desk{min-height:0;grid-template-rows:auto;grid-auto-rows:minmax(0,1fr)}
body.board.room-on .desk .st{overflow:hidden}
body.board.room-on .gh{min-height:1.9rem}
.gh.still b{color:var(--pts)}
body.board.room-on:not(.show) .desk .st{flex-direction:row;flex-wrap:wrap;align-items:center;align-content:center;column-gap:.4rem}
body.board.room-on:not(.show) .desk .st .nm{flex:1 1 auto}body.board.room-on .desk .st .bd{margin-top:0;min-height:0}
@media (min-width:900px){body.board .desk .st .nm{font-size:1.05rem}body.board .desk .st .b{font-size:.75rem;height:1.3rem}body.show .desk .st .nm{font-size:1.25rem}}
/* ---- reports ---- */
.chart{width:100%;height:auto;max-width:46rem;display:block;margin:.4rem 0;font:600 11px var(--font);fill:#6B7280}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;font-size:.82rem;font-weight:600;color:var(--ink2)}
.legend i{display:inline-block;width:1rem;height:.3rem;border-radius:.2rem;margin-inline-end:.35rem;vertical-align:middle}
.chip[disabled]{opacity:.4;pointer-events:none}
.ctl .sp,.rowc .sp{flex:1}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{padding:0;background:#fff;display:block !important}
  body>*:not(#sheet){display:none !important}
  .sheet{position:static;display:block !important;background:none}
  .sheet .pan{width:100%;max-height:none;overflow:visible;border-radius:0;padding:0;box-shadow:none}
  .sheet .x,.noprint{display:none !important}
  .tw{max-height:none;overflow:visible;border-color:#000}
  table.rp th{position:static}table.rp td.n{position:static}
  table.rp td,table.rp th{padding:.25rem .35rem;font-size:9.5pt}
  tr{break-inside:avoid}.chart{max-width:16cm;break-inside:avoid}
}
/* ---- stage 1 additions ---- */
.perm{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:.6rem;margin:.3rem .8rem 0;padding:.7rem 1rem;border-radius:.9rem;background:var(--warn);color:#fff;font-weight:700;font-size:1rem;width:calc(100% - 1.6rem)}
.perm[hidden]{display:none}.perm svg{width:1.3rem;height:1.3rem;flex:none}.perm small{display:block;font-weight:600;font-size:.8rem;opacity:.9}
.perm:focus-visible{outline:3px solid #E0A21A;outline-offset:2px}
.brand{font-size:1.05rem}
.slot{text-align:right}div.slot{cursor:default}
.save{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;min-height:2.3rem;padding:0 .5rem;font-size:.78rem;font-weight:700;color:var(--ink2);border-radius:.6rem}
.save i{width:.65rem;height:.65rem;border-radius:50%;background:#18874A;flex:none}
.save.warn i{background:#B97A00}.save.bad{color:var(--warn)}.save.bad i{background:var(--warn)}
.save:focus-visible{outline:3px solid #E0A21A}
.priv{display:inline-flex;align-items:center;min-height:2rem;padding:0 .7rem;border-radius:.6rem;font-size:.78rem;font-weight:700;color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn);background:#fff}
header .chip svg{width:1.1rem;height:1.1rem;margin-inline-end:.35rem}
.remind{display:none;gap:.6rem;align-items:center;margin:.3rem .8rem 0;padding:.55rem .8rem;border-radius:.8rem;background:var(--att);color:#fff;font-weight:700;font-size:.9rem}
.remind.on{display:flex}.remind span{flex:1}
.remind button{all:unset;cursor:pointer;padding:.3rem .8rem;border-radius:.6rem;background:#fff;color:var(--att);font-size:.8rem}
body.setup .sticky,body.setup .bar,body.setup .grid,body.setup .ctl{display:none}
body.setup{padding-bottom:1rem}
.setupw{max-width:46rem;margin:.6rem auto 0;padding:0 .8rem}
.card{background:#fff;border-radius:1.2rem;padding:1rem 1.1rem;box-shadow:inset 0 0 0 2px var(--line);margin-bottom:.9rem}
.card h2{margin:0 0 .3rem;font-size:1.15rem}.card p,.pan p{margin:.3rem 0;color:var(--ink2);font-size:.9rem;line-height:1.7}
textarea{width:100%;font:600 1rem/1.7 var(--font);padding:.7rem .8rem;border-radius:.8rem;border:2px solid var(--line);direction:rtl;resize:vertical;margin-top:.4rem}
textarea:focus{outline:3px solid #E0A21A;border-color:var(--ink)}
.inl{display:flex;gap:.5rem;align-items:center;margin:.45rem 0;flex-wrap:wrap}
.inl input[type=text]{flex:1;min-width:9rem;width:auto}
.card input[type=text],.inl input[type=time]{font:600 1rem var(--font);padding:.6rem .7rem;border-radius:.8rem;border:2px solid var(--line)}
.fld{display:block;margin:.5rem 0;font-size:.82rem;font-weight:600;color:var(--ink2)}.fld input{margin-top:.25rem}
.alert{color:var(--warn) !important;font-weight:700}
.pv{margin:.4rem 0 .2rem;padding:0 1.4rem 0 0;columns:2;column-gap:1.4rem;font-size:.9rem}
.pv li{break-inside:avoid;padding:.15rem 0}.pv small{display:block;color:var(--ink2);font-size:.74rem}
.chip.big{min-height:3.2rem;padding:0 1.2rem;font-size:1.05rem}
.chip.miss{background:var(--tool);color:#fff;box-shadow:none}
.menu{display:grid;gap:.6rem;margin-top:.8rem}.menu .act{justify-content:flex-start;min-height:3.4rem;font-size:1rem}
p.empty{grid-column:1/-1;color:var(--ink2);font-weight:600;padding:1rem 0}
.ros{display:grid;grid-template-columns:minmax(8rem,1fr) minmax(10rem,2fr) auto;gap:.4rem;align-items:center;margin:.3rem 0}
.ros input{min-width:0}
.tt .h small{font-weight:600;font-size:.66rem}
body.board .more,body.board .priv{display:none}
@media (max-width:700px){.save span{display:none}.priv{display:none}.pv{columns:1}.ros{grid-template-columns:1fr 1fr}.ros .del{grid-column:1/-1;justify-self:start}}
@media (min-width:900px){
  /* board on the projector: the whole class fits one screen; rows share the free height */
  body.board{min-height:100vh;display:flex;flex-direction:column;padding-bottom:3.5rem}
  body.board header{padding:.45rem .8rem .1rem}
  body.board .slot{min-height:2.8rem}body.board .slot b{font-size:1.3rem}
  body.board .sticky{padding:.35rem .8rem .4rem}
  body.board .modes{max-width:none}
  body.board .mode{min-height:2.8rem;flex-direction:row;gap:.5rem;font-size:1rem}
  body.board .sub{margin-top:.35rem;min-height:2.2rem}
  body.board .ctl{padding-top:.35rem}
  body.board .grid{flex:1;grid-template-columns:repeat(var(--cols,6),1fr);grid-auto-rows:1fr;gap:.5rem;padding:.5rem .8rem}
  body.board .st{min-height:4.2rem;padding:.4rem .65rem;gap:.2rem}
  body.board .st .nm{font-size:1.3rem;line-height:1.3;padding-inline-end:0;flex:0 0 auto}
  body.board .st .bd{margin-top:auto}
  body.board .b{font-size:.88rem;height:1.55rem;padding:0 .45rem}body.board .b svg{width:1rem;height:1rem}
  body.board .bar{padding:.4rem .8rem}body.board .act{min-height:2.6rem}
  body:not(.board) .grid{grid-template-columns:repeat(7,1fr)}
}

function newId(){if(!PHONE)return{id:C.uid()};D.pctr=(D.pctr||0)+1;return{id:'p'+D.dev+'-'+D.pctr.toString(36),n:D.pctr};}

const liveClasses=()=>D.classes.filter(c=>!c.arch);
const cls=()=>D.classes.find(c=>c.id===S.cls);
const cname=id=>(D.classes.find(c=>c.id===id)||{}).name||'';
const stu=id=>D.students.find(s=>s.id===id);

/* ================= saving ================= */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('scienceHub',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function kvGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function kvSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
const KV=window.HUB_TEST_KV||{get:kvGet,set:kvSet};   // test seam: the test browser cannot read a stored folder back
async function writeFile(dir,name,text){const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(text);await w.close();}
async function readDir(){try{const fh=await sv.dir.getFileHandle('hub-data.json');const t=await(await fh.getFile()).text();return t?JSON.parse(t):null;}
  catch(e){if(e.name==='NotFoundError')return null;throw e;}}
/* one copy per teaching day, holding the data as it stood when the Hub was first opened that day */
async function backupDay(text){const bd=await sv.dir.getDirectoryHandle('backups',{create:true}),name='hub-'+today()+'.json';
  try{await bd.getFileHandle(name);}catch(e){if(e.name!=='NotFoundError')throw e;await writeFile(bd,name,text);}}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(D));return true;}catch(e){return false;}}
function setSave(s){if(sv.state===s)return;sv.state=s;header();perm();if(S.sheet&&S.sheet.t==='save')sheet();}
function flush(){sv.q=sv.q.then(()=>writeFile(sv.dir,'hub-data.json',JSON.stringify(D))).then(()=>setSave('folder'),e=>{console.warn('save',e);setSave('error');});return sv.q;}
function changed(){D.saved=Date.now();const ok=persistLocal();
  if(sv.dir&&sv.state!=='need'){clearTimeout(sv.timer);sv.timer=setTimeout(flush,200);}
  else if(!ok)toast('تعذّر الحفظ في المتصفح. نزّل نسخة احتياطية الآن.','warn');
  render();lessonSync();if(PHONE)liveSend();}
async function attach(){const f=await readDir();
  if(f&&f.v){await backupDay(JSON.stringify(f));D=(D.classes.length||D.recs.length)?C.merge(D,fix(f)):fix(f);}
  persistLocal();await flush();}
async function chooseDir(){
  try{const h=await window.showDirectoryPicker({mode:'readwrite',id:'scienceHub'});sv.dir=h;await KV.set('dir',h);await attach();
    if(sv.state==='folder')toast('سيُحفظ كل شيء في هذا المجلد تلقائياً','info');}
  catch(e){if(e.name!=='AbortError'){console.warn(e);setSave('error');toast('تعذّر استخدام هذا المجلد','warn');}}
  S.slotKey=null;autoClass();render();sheet();}
let asking=false;
async function regrant(){if(asking)return;asking=true;try{if(await sv.dir.requestPermission({mode:'readwrite'})==='granted'){await attach();S.slotKey=null;autoClass();render();sheet();}}catch(e){console.warn(e);setSave('error');}finally{asking=false;}}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}

/* ================= records ================= */
function rec(sid,k,v,x){const dt=now();return Object.assign(newId(),{d:C.iso(dt),p:C.periodFor(D,S.cls,dt),c:S.cls,s:sid,k,v,t:dt.getTime()},x||{});}
function act(label,add,rem){
  rem.forEach(r=>{const i=D.recs.indexOf(r);if(i>=0)D.recs.splice(i,1);D.del.push(r.id);if(r.sent)(D.pdel=D.pdel||[]).push(r.id);});
  add.forEach(r=>D.recs.push(r));S.ops.push({label,add:add.map(r=>r.id),rem});changed();}
function undo(){const o=S.ops.pop();if(!o)return;
  D.recs=D.recs.filter(r=>{if(!o.add.includes(r.id))return true;if(r.sent)(D.pdel=D.pdel||[]).push(r.id);return false;});D.del.push(...o.add);
  o.rem.forEach(r=>{D.recs.push(r);D.del=D.del.filter(x=>x!==r.id);if(D.pdel)D.pdel=D.pdel.filter(x=>x!==r.id);});changed();}
function tap(sid){
  const st=stu(sid);if(!st)return;const o=C.dayState(D,sid,today()),nm=esc(st.name);
  if(S.mode==='att'){const v=C.nextAtt(o.att);
    act({A:'غائب',L:'متأخر',P:'حاضر'}[v]+' · '+nm,v==='P'?[]:[rec(sid,'att',v)],o.recs.filter(r=>r.k==='att'));return;}
  if(o.att==='A'){toast(nm+' غائب اليوم، لم يُسجَّل شيء','info');return;}
  if(S.mode==='tool'){open('tool',sid);return;}
  if(S.mode==='part'){act('مشاركة · '+nm,[rec(sid,'part',1)],[]);return;}
  if(S.mode==='pts'){const v=D.set.pts[S.pv]!=null?D.set.pts[S.pv]:D.set.pts[0];act('نقاط '+sgn(v)+' · '+nm,[rec(sid,'pts',v)],[]);return;}
  if(o.warn>=3){toast('سُجّلت مخالفة للطالب '+nm+' اليوم','info');return;}
  const before=C.streak(D,sid,S.cls,today()).n;
  act(C.LEVELS[o.warn+1]+' · '+nm,[rec(sid,'warn',1,{r:D.set.reasons[S.reason]||''})],[]);
  if(before<3&&C.streak(D,sid,S.cls,today()).n>=3&&S.view==='teacher')toast(nm+': إنذار في ثلاث حصص متتالية','warn','fu');
}
function toggleTool(sid,tid){const o=C.dayState(D,sid,today()),old=o.recs.filter(r=>r.k==='tool'&&r.v===tid),nm=esc(stu(sid).name),tn=esc(toolName(tid));
  if(old.length)act('أحضر '+tn+' · '+nm,[],old);else act('بدون '+tn+' · '+nm,[rec(sid,'tool',tid)],[]);}

/* ================= class of the moment ================= */
function autoClass(){
  const s=C.slotAt(D,now()),key=s?s.day+'-'+s.p:'none';
  if(key!==S.slotKey){S.slotKey=key;const c=s&&s.cell.c&&D.classes.find(x=>x.id===s.cell.c&&!x.arch);if(c)S.cls=c.id;}
  if(!cls()||cls().arch)S.cls=(liveClasses()[0]||{}).id||null;
  if(S.day!==today()){S.day=today();S.ops=[];}
}
/* a lesson that passes with no tap still counts as a lesson (it ends a run of warned lessons) */
function marker(){const dt=now(),s=C.slotAt(D,dt);
  if(!s||s.cell.c!==S.cls||dt<s.start||!studs(S.cls).length||D.recs.some(r=>r.c===S.cls&&r.d===today()))return false;
  D.recs.push(Object.assign(newId(),{d:today(),p:s.p,c:S.cls,s:null,k:'les',v:1,t:dt.getTime()}));changed();return true;}
function tick(){const pc=S.cls,pd=S.day;autoClass();remind();lessonSync();if(marker())return;if(pc!==S.cls||pd!==S.day)render();else header();}

/* ================= main screen ================= */
const B=(c,h,out)=>`<span class="b ${out?'out':''}" style="--c:var(--${c})">${h}</span>`;
function badges(o,T){const b=[];
  if(o.att==='A')b.push(B('att','غائب'));if(o.att==='L')b.push(B('att','متأخر',1));
  o.missing.forEach(id=>b.push(B('tool','بدون '+esc(toolName(id)),1)));
  if(o.part)b.push(B('part',IC.part+L(o.part)));
  if(o.pts)b.push(B('pts',IC.pts+sgn(o.pts)));
  if(o.warn)b.push(B('warn',IC.warn+C.LEVELS[C.level(o.warn)],o.warn<3));
  if(T&&o.notes.length)b.push(B('ink',IC.note+L(o.notes.length),1));
  return b.join('');}
function saveChip(){const m={folder:['','محفوظ في المجلد'],browser:['warn','محفوظ في المتصفح فقط'],nofs:['warn','محفوظ في المتصفح فقط'],need:['bad','اضغط لمتابعة الحفظ في المجلد'],error:['bad','تعذّر الحفظ في المجلد']}[sv.state];
  return `<button class="save ${m[0]}" ${sv.state==='need'?'data-regrant':'data-open="save"'} title="${m[1]}"><i></i><span>${m[1]}</span></button>`;}

    (PHONE?'':`<a class="chip" href="science-g8/index.html" target="_blank" rel="noopener" data-book>${IC.book}الدروس</a>`+(T?`<button class="chip" data-open="rep">${IC.list}التقارير</button>`:''))+
    `<button class="chip" data-view="${T?'board':'teacher'}">${T?'عرض السبورة':'عرض المعلم'}</button>`+

}
function modes(){
  $('modes').innerHTML=MODES.map(([k,n])=>`<button class="mode ${S.mode===k?'on':''}" data-mode="${k}" style="--c:var(--${k})">${IC[k]}<span>${n}</span></button>`).join('');

    :`<span class="lbl">${{att:'اضغط على الاسم: غائب، ثم متأخر، ثم حاضر',tool:'اضغط على الاسم لتحديد ما لم يحضره',part:'كل ضغطة على الاسم مشاركة واحدة'}[S.mode]}</span>`;
}
function grid(){
  const T=S.view==='teacher',d=today(),list=studs(S.cls);let pres=0;

  const g=$('grid');
  if(S.lay==='list'){
    if(T&&S.sort!=='name'){const wk=C.range('week',d,0),pw={},lv={};list.forEach(s=>{pw[s.id]=C.summary(D,s.id,wk.from,wk.to).pts;lv[s.id]=lvOf(s.id);});
      list.sort((a,b)=>S.sort==='level'?lv[b.id]-lv[a.id]||pw[b.id]-pw[a.id]:pw[b.id]-pw[a.id]);}
    g.className='grid';

  const dt=now(),nx=C.nextLesson(D,dt),seg=`<span class="seg sm">${[['list','قائمة'],['seats','مقاعد'],['show','عرض الجلوس']].map(x=>`<button class="${S.lay===x[0]?'on':''}" data-lay="${x[0]}">${x[1]}</button>`).join('')}</span>`;
  if(S.lay==='show'){$('ctl').innerHTML=seg+`<h2>أماكن الجلوس · ${cn(cname(S.cls))}</h2><span class="sp"></span><button class="chip sm ${S.flip?'on':''}" data-flip>${S.flip?'كما يراه المعلم':'كما يراه الطلاب'}</button>`;return;}

      `<button class="chip sm ${S.apart?'warnon':''}" data-apart>+ لا يجلسان معاً</button>`+ap.map((x,k)=>`<span class="pairx">${esc((stu(x[0])||{}).name||'')} ✕ ${esc((stu(x[1])||{}).name||'')}<button data-unapart="${k}" aria-label="احذف">${IC.x}</button></span>`).join('')+
      `<span class="hint">${S.apart?'اضغط على الطالبين اللذين لا يجلسان معاً.':'اسحب الاسم إلى مقعد آخر، أو اضغط على اسم ثم على المقعد الجديد. يتبادل الطالبان المكانين.'}</span>`;return;}
  $('ctl').innerHTML=seg+`<span>${WD[dt.getDay()]} ${L(dt.getDate()+'/'+(dt.getMonth()+1))}</span><span>·</span><span>الحاضرون ${L(pres)} من ${L(list.length)}</span>`+
    (nx?`<span>·</span><span>الحصة التالية: ${cn(C.cellName(D,nx.cell))}، ${WD[nx.day]} ${L(D.periods[nx.p][0])}</span>`:'')+
    (T&&list.length&&S.lay==='list'?`<span class="sp"></span><span>الترتيب:</span>`+[['name','الاسم'],['level','المستوى'],['pts','نقاط الأسبوع']].map(x=>`<button class="chip sm ${S.sort===x[0]?'on':''}" data-sort="${x[0]}">${x[1]}</button>`).join('')+`<span>${[3,2,1,0].map(k=>dot(k)+C.LVN[k]).join(' · ')}</span>`:'')+

/* ================= seating ================= */
const seatOf=cid=>D.seat[cid]||(D.seat[cid]={shape:'pairs',plans:{},apart:[]});
const shapeOf=cid=>(D.seat[cid]||{}).shape||'pairs';
const planOf=cid=>C.seatPlan(D,cid,shapeOf(cid));
function setPlan(cid,p){seatOf(cid).plans[shapeOf(cid)]=p;}
function room(st,T){
  const sh=shapeOf(S.cls),G=C.GEO[sh],plan=planOf(S.cls),show=S.lay==='show',plain=show||S.arr;
  const bad=new Set(T?[].concat(...C.clashes(plan,sh,seatOf(S.cls).apart)):[]);
  const tile=(sid,p)=>{if(!sid)return `<button class="st empty" data-p="${p}" aria-label="مقعد فارغ"></button>`;
    const s=stu(sid),o=st[sid],w=s.name.split(' '),nm=w.length>1?`${esc(w[0])} <span class="fam">${esc(w.slice(1).join(' '))}</span><span class="ini">${esc(w[w.length-1].replace(/^ال/,'').slice(0,1))}.</span>`:esc(s.name);
    return `<button class="st ${o.att==='A'&&!plain?'abs':''} ${S.pick===p||(S.apart||[]).includes(sid)?'pick':''} ${bad.has(sid)&&T&&!show?'bad':''}" data-p="${p}" ${plain?'':`data-st="${sid}"`} data-sid="${sid}"><span class="nm">${T&&!plain?dot(lvOf(sid)):''}${nm}</span>${plain?'':`<span class="bd">${badges(o,T)}</span>`}</button>`;};
  const desks=[];for(let u=0;u*G.size<plan.length;u++){const mem=plan.slice(u*G.size,(u+1)*G.size);let hd='';
    if(sh==='groups'&&mem.some(Boolean)){const tot=mem.reduce((n,x)=>n+(x?st[x].pts:0),0),v=D.set.pts[S.pv]!=null?D.set.pts[S.pv]:D.set.pts[0];
      hd=plain||S.mode!=='pts'?`<div class="gh still"><span>المجموعة ${u+1}</span>${plain?'':`<b>${L(tot)} نقطة</b>`}</div>`
        :`<button class="gh" data-g="${u}" aria-label="نقاط للمجموعة ${u+1}"><span>المجموعة ${u+1}</span><b>${L(tot)} نقطة</b><i>${sgn(v)} للكل</i></button>`;}
    desks.push(`<div class="desk" data-desk="${u}" style="--dc:${G.dc}">${hd}${mem.map((x,k)=>tile(x,u*G.size+k)).join('')}</div>`);}
  const per=G.per,rows=[];for(let r=0;r*per<desks.length;r++)rows.push(desks.slice(r*per,r*per+per));
  const flip=show&&S.flip,body=(flip?rows.slice().reverse().map(r=>r.slice().reverse()):rows).map(r=>r.join('')).join('');
  const front=`<div class="front">السبورة</div>`;
  $('grid').className='room'+(flip?' flip':'');$('grid').innerHTML=(flip?'':front)+`<div class="rows" style="--per:${per}">${body}</div>`+(flip?front:'');
}
function swapSeats(p,q,ask){
  const sh=shapeOf(S.cls),plan=planOf(S.cls),ap=seatOf(S.cls).apart||[],before=C.clashes(plan,sh,ap).map(String);
  const a=plan.slice();[a[p],a[q]]=[a[q],a[p]];S.pick=null;setPlan(S.cls,a);changed();
  const fresh=C.clashes(a,sh,ap).filter(x=>!before.includes(String(x)));
  if(ask&&fresh.length)open('clash',{p,q,pairs:fresh});
}

  <div class="rowc"><button class="act dark" data-unswap="${a.p}:${a.q}">تراجع عن النقل</button><button class="act" data-x>نعم، أجلسهما معاً</button></div>`;}

/* ================= lessons: one class list, and points that come back ================= */
/* The lesson sites keep their classes in this browser under 'lessonClasses1'. The Hub writes its own classes there
   (present students only, so the random picker skips whoever is absent today) and reads back the points a student
   earned inside a lesson. Nothing in the lesson files changes. */
const LKEY='lessonClasses1',TEAM=[['الأحمر','#C93A26','#FFFFFF'],['الأزرق','#2374C6','#FFFFFF'],['الأخضر','#18874A','#FFFFFF'],['الأصفر','#F2B61B','#1D232C']];
const mkTeams=()=>TEAM.map(t=>({name:'الفريق '+t[0],c:t[1],ink:t[2],score:0}));
let syncing=false;
function lessonSync(){
  if(PHONE||syncing||!liveClasses().length)return;let raw=null,db=null;try{raw=localStorage.getItem(LKEY);db=JSON.parse(raw||'null');}catch(e){}
  if(!db||!Array.isArray(db.classes)||!db.classes.length)db={cur:'quick',classes:[{id:'quick',name:'فرق سريعة',students:[],teams:mkTeams(),picked:[]}]};
  const d=today(),got=[];D.lp=D.lp||{};let lpChanged=false;
  db.classes.forEach(c=>{if(!/^hub-/.test(c.id))return;(c.students||[]).forEach(s=>{
    const st=(s.h&&stu(s.h))||D.students.find(x=>'hub-'+x.c===c.id&&x.name===s.n);if(!st)return;
    const p=s.p||0,seen=D.lp[st.id]||0;if(p>seen)got.push({st,v:p-seen});if(p!==seen){D.lp[st.id]=p;lpChanged=true;}});});
  const live=liveClasses();db.classes=db.classes.filter(c=>!/^hub-/.test(c.id)||live.some(x=>'hub-'+x.id===c.id));
  live.forEach(hc=>{let c=db.classes.find(x=>x.id==='hub-'+hc.id);if(!c){c={id:'hub-'+hc.id,name:hc.name,students:[],teams:mkTeams(),picked:[]};db.classes.push(c);}
    c.name=hc.name;if(!Array.isArray(c.teams)||!c.teams.length)c.teams=mkTeams();
    const old=(c.students||[]).concat(c.away||[]),nt=c.teams.length;
    const all=studs(hc.id).map((s,i)=>{const o=old.find(x=>x.h===s.id)||old.find(x=>!x.h&&x.n===s.name)||{t:i%nt,p:0};return{n:s.name,t:o.t>=0&&o.t<nt?o.t:i%nt,p:o.p||0,h:s.id};});
    const abs=new Set(all.filter(x=>C.dayState(D,x.h,d).att==='A').map(x=>x.h));
    c.students=all.filter(x=>!abs.has(x.h));c.away=all.filter(x=>abs.has(x.h));c.picked=(c.picked||[]).filter(n=>c.students.some(s=>s.n===n));});
  if(cls()&&S.lcur!==S.cls){S.lcur=S.cls;db.cur='hub-'+S.cls;}
  const out=JSON.stringify(db);if(out!==raw)try{localStorage.setItem(LKEY,out);}catch(e){}
  if(got.length){syncing=true;const dt=now();
    try{act('نقاط من الدرس · '+(got.length===1?esc(got[0].st.name):L(got.length)+' طلاب'),got.map(g=>Object.assign(rec(g.st.id,'pts',g.v),{c:g.st.c,p:C.periodFor(D,g.st.c,dt),src:'ls'})),[]);
      toast('وصلت من الدرس: '+got.map(g=>esc(g.st.name)+' '+sgn(g.v)).join('، '),'info');}finally{syncing=false;}}
  else if(lpChanged)persistLocal();
}
addEventListener('storage',e=>{if(e.key===LKEY)lessonSync();});
addEventListener('focus',lessonSync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)lessonSync();});

/* the QR reader: the browser's own when it has one; otherwise jsQR, taken from a file beside the Hub, or from this browser's
   store, or once from the internet and then kept */
const JSQR='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
function inject(code){const s=document.createElement('script');s.textContent=code;document.head.appendChild(s);s.remove();return !!window.jsQR;}
async function ensureJsQR(){
  if(window.jsQR)return true;
  await new Promise(r=>{const s=document.createElement('script');s.src='jsQR.js';s.onload=s.onerror=()=>{s.remove();r();};document.head.appendChild(s);});
  if(window.jsQR)return true;
  try{const c=await kvGet('jsqr');if(c&&inject(c))return true;}catch(e){}
  const res=await fetch(JSQR);if(!res.ok)throw new Error('jsqr');const code=await res.text();
  if(!inject(code))throw new Error('jsqr');try{await kvSet('jsqr',code);}catch(e){}return true;}
let scan=null;
function stopScan(){if(scan){scan.on=false;if(scan.stream)scan.stream.getTracks().forEach(t=>t.stop());scan=null;}}
async function startScan(want){
  stopScan();const my=scan={on:true,want,col:C.collector()},st=$('scSt'),v=$('scVid'),say=h=>{if(my.on&&$('scSt'))$('scSt').innerHTML=h;};
  try{my.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:Object.assign({width:{ideal:1280},height:{ideal:720}},PHONE?{facingMode:'environment'}:{})});}
  catch(e){say('تعذّر فتح الكاميرا. اسمح للبرنامج باستخدامها من شريط العنوان، ثم أعد المحاولة.');return;}
  if(!my.on){my.stream.getTracks().forEach(t=>t.stop());return;}
  v.srcObject=my.stream;try{await v.play();}catch(e){}
  let det=null;if('BarcodeDetector' in window){try{if((await BarcodeDetector.getSupportedFormats()).includes('qr_code'))det=new BarcodeDetector({formats:['qr_code']});}catch(e){}}
  if(!det){say('جارٍ تجهيز قارئ الرموز…');try{await ensureJsQR();}catch(e){say('قارئ الرموز غير موجود على هذا الجهاز بعد. صِل الجهاز بالإنترنت مرة واحدة ثم أعد المحاولة.');return;}}
  say(PHONE?'وجّه الكاميرا إلى الرمز على شاشة الحاسوب.':'قرّب شاشة الهاتف من الكاميرا.');
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const loop=async()=>{if(!my.on)return;let text='';
    try{if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
      if(det){const r=await det.detect(cv);if(r&&r[0])text=r[0].rawValue;}else{const d=cx.getImageData(0,0,cv.width,cv.height),r=window.jsQR(d.data,d.width,d.height);if(r&&r.data)text=r.data;}}}catch(e){}
    if(text&&rx(text))return;setTimeout(loop,120);};

function rx(text){
  if(!scan)return false;const o=scan.col.add(text);if(!o)return false;
  if(o.kind!==scan.want){if($('scSt'))$('scSt').textContent=PHONE?'هذا رمز سجلات، وليس رمز الصفوف.':'هذا رمز الصفوف، وليس سجلات الهاتف.';return false;}
  if($('scSt'))$('scSt').innerHTML='استُلم '+L(o.have)+' من '+L(o.total);if(!o.done)return false;
  stopScan();
  if(o.kind==='O'){liveAnswer(o.text).catch(e=>{console.warn(e);LK.step='fail';sheet();});return true;}
  if(o.kind==='A'){liveAccept(o.text);return true;}
  try{if(PHONE){C.applyRoster(D,C.unpackRoster(o.text));S.slotKey=null;S.sheet=null;autoClass();changed();sheet();
      toast('استُلمت الصفوف: '+L(liveClasses().length)+' صفوف و'+L(D.students.length)+' طالباً','info');}
    else{const u=C.unpackRecs(o.text,D),r=C.receive(D,u);S.ops=[];changed();open('rx',Object.assign(r,{unknown:u.unknown}));}}
  catch(e){console.warn(e);S.sheet=null;sheet();toast('الرمز غير صالح. أعد المحاولة.','warn');}
  return true;}

/* ================= direct live link (approach B) =================
   The laptop shows an "offer" code, the phone answers with its own code, and the two connect directly over the
   school network with no server. While connected, every tap on the phone appears on the laptop at once. If the
   network does not allow it, nothing is lost: the QR hand-off keeps working. */
const LK={state:'off',step:'',pc:null,dc:null,fr:null,inflight:null,t0:0,timer:0};
function liveOn(){return LK.state==='on';}
function liveClose(quiet){clearTimeout(LK.timer);try{LK.dc&&LK.dc.close();}catch(e){}try{LK.pc&&LK.pc.close();}catch(e){}
  const was=LK.state==='on';Object.assign(LK,{state:'off',pc:null,dc:null,fr:null,inflight:null});
  if(was&&!quiet)toast(PHONE?'انقطع الاتصال المباشر. السجلات محفوظة على الهاتف وتُنقل لاحقاً.':'انقطع الاتصال المباشر بالهاتف.','warn');header();bar();}
function newPC(){const pc=new RTCPeerConnection({iceServers:navigator.onLine?[{urls:'stun:stun.l.google.com:19302'}]:[]});
  pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState)&&LK.pc===pc)liveClose();};return pc;}
const gathered=pc=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const t=setTimeout(r,4000);
  pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);r();}});});
function wire(dc){LK.dc=dc;
  dc.onopen=()=>{LK.state='on';LK.step='on';clearTimeout(LK.timer);header();bar();if(S.sheet&&S.sheet.t==='live')sheet();
    toast(PHONE?'متصل بالحاسوب. ما تسجّله يظهر على السبورة مباشرة.':'متصل بالهاتف مباشرة.','info');if(PHONE)liveSend();};
  dc.onclose=()=>{if(LK.dc===dc)liveClose();};
  dc.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}
    if(!PHONE&&m.r){try{const u=C.unpackRecs(m.r,D),res=C.receive(D,u);dc.send(JSON.stringify({ack:u.recs.map(r=>r.id),del:u.dels}));
        if(res.added||res.removed)changed();if(u.unknown)toast('وصلت سجلات لطلاب غير معروفين هنا. أرسل الصفوف إلى الهاتف من جديد.','warn');}catch(x){console.warn(x);}}
    if(PHONE&&m.ack){const a=new Set(m.ack);D.recs.forEach(r=>{if(a.has(r.id))r.sent=true;});D.pdel=(D.pdel||[]).filter(x=>!(m.del||[]).includes(x));
      LK.inflight=null;persistLocal();bar();liveSend();}};}
/* phone: send whatever the laptop does not have yet; one batch at a time */
function liveSend(){if(!PHONE||!liveOn()||LK.inflight)return;const recs=unsent(),dels=(D.pdel||[]).slice();if(!recs.length&&!dels.length)return;
  LK.inflight=1;try{LK.dc.send(JSON.stringify({r:C.packRecs(D,recs,dels)}));}catch(e){LK.inflight=null;}
  setTimeout(()=>{if(LK.inflight){LK.inflight=null;liveSend();}},4000);}
async function liveStart(){liveClose(true);LK.state='wait';LK.step='offer';LK.t0=Date.now();
  const pc=LK.pc=newPC();wire(pc.createDataChannel('hub',{ordered:true}));
  await pc.setLocalDescription(await pc.createOffer());await gathered(pc);if(LK.pc!==pc)return;
  LK.fr=C.frames('O',JSON.stringify({t:'offer',s:pc.localDescription.sdp}),700);sheet();}
async function liveAnswer(text){liveClose(true);LK.state='wait';LK.t0=Date.now();
  const pc=LK.pc=newPC();pc.ondatachannel=e=>wire(e.channel);
  await pc.setRemoteDescription({type:'offer',sdp:JSON.parse(text).s});await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);if(LK.pc!==pc)return;
  LK.fr=C.frames('A',JSON.stringify({t:'answer',s:pc.localDescription.sdp}),280);LK.step='answer';sheet();
  LK.timer=setTimeout(()=>{if(LK.state!=='on'){LK.step='fail';liveClose(true);if(S.sheet&&S.sheet.t==='live')sheet();}},45000);}
async function liveAccept(text){try{await LK.pc.setRemoteDescription({type:'answer',sdp:JSON.parse(text).s});}catch(e){LK.step='fail';sheet();return;}
  LK.step='wait';sheet();LK.timer=setTimeout(()=>{if(LK.state!=='on'){LK.step='fail';liveClose(true);if(S.sheet&&S.sheet.t==='live')sheet();}},15000);}

  if(st==='offer')return `<h2>الاتصال المباشر: الخطوة 1</h2><p>على الهاتف: «القائمة»، ثم «الاتصال المباشر»، ووجّه كاميرا الهاتف إلى هذا الرمز. عندما يعرض الهاتف رمزه، اضغط «التالي».</p>

  if(el=q('[data-dis]')){S.dis=el.dataset.dis;remind();return;}
  if(q('[data-regrant]')){regrant();return;}
  if(el=q('[data-open]')){if(el.dataset.open){$('toast').classList.remove('on');open(el.dataset.open,el.dataset.a);}return;}
  if(q('[data-livego]')){LK.step=PHONE?'':'prep';open('live');if(!PHONE)liveStart().catch(e=>{console.warn(e);LK.step='fail';sheet();});else{liveClose(true);LK.step='';sheet();}return;}
  if(q('[data-livenext]')){LK.step='scan';sheet();return;}
  if(q('[data-liveoff]')){liveClose(true);S.sheet=null;sheet();return;}
  if(q('[data-sent]')){const ids=new Set(S.out.recs.map(r=>r.id));D.recs.forEach(r=>{if(ids.has(r.id))r.sent=true;});D.pdel=(D.pdel||[]).filter(x=>!S.out.dels.includes(x));S.ops=[];S.sheet=null;changed();sheet();toast('تمّ. السجلات الآن على الحاسوب.','info');return;}
  if(q('[data-dir]')){chooseDir();return;}
  if(el=q('[data-tl]')){toggleTool(el.dataset.id,el.dataset.tl);return;}
  if(el=q('[data-del]')){const r=D.recs.find(x=>x.id===el.dataset.del);if(r)act('حذف: '+recLbl(r)+' · '+esc(stu(r.s).name),[],[r]);return;}
  if(el=q('[data-note]')){const v=C.clean($('ntIn').value);if(v)act('ملاحظة · '+esc(stu(el.dataset.note).name),[rec(el.dataset.note,'note',v)],[]);return;}
  if(el=q('[data-mv]')){const s=stu(el.dataset.id);s.c=el.dataset.mv;S.sheet=null;changed();sheet();toast('نُقل '+esc(s.name)+' إلى '+cn(cname(s.c)),'info');return;}
  if(el=q('[data-sarch]')){const s=stu(el.dataset.sarch);s.arch=true;if(S.sheet&&S.sheet.t==='stu')S.sheet=null;changed();sheet();toast('أُرشف '+esc(s.name)+'. يمكن استعادته من «الصفوف والأسماء».','info');return;}
  if(el=q('[data-sback]')){delete stu(el.dataset.sback).arch;changed();sheet();return;}
  if(el=q('[data-carch]')){D.classes.find(c=>c.id===el.dataset.carch).arch=true;D.tt=D.tt.map(r=>r.map(c=>c&&c.c===el.dataset.carch?null:c));S.slotKey=null;autoClass();changed();sheet();return;}
  if(el=q('[data-cback]')){delete D.classes.find(c=>c.id===el.dataset.cback).arch;autoClass();changed();sheet();return;}
  if(q('[data-addc]')){const v=C.clean($('ncIn').value);if(v){D.classes.push({id:'c'+C.uid(),name:v});C.number(D);autoClass();changed();sheet();}return;}
  if(el=q('[data-imc]')){keepText();S.im.cls=S.im.cls===el.dataset.imc?'':el.dataset.imc;S.im.pv=null;refresh();return;}
  if(q('[data-impv]')){buildPreview();refresh();return;}
  if(q('[data-imsave]')){saveImport();return;}
  if(el=q('[data-pick]')){S.cls=el.dataset.pick;render();lessonSync();sheet();return;}
  if(q('[data-tted]')){S.ttEdit=!S.ttEdit;sheet();return;}
  if(el=q('[data-tc]')){const[d,p]=el.dataset.tc.split('-').map(Number),cur=D.tt[d][p],cl=liveClasses(),i=cur&&cur.c?cl.findIndex(c=>c.id===cur.c):-1;
    D.tt[d][p]=!cur?(cl[0]?{c:cl[0].id}:{x:D.set.other}):cur.x?null:cl[i+1]?{c:cl[i+1].id}:{x:D.set.other};S.slotKey=null;autoClass();changed();sheet();return;}
  if(q('[data-ics]')){download('my-lessons-reminders.ics',C.ics(D,now()),'text/calendar');return;}
  if(el=q('[data-tdel]')){const tl=D.set.tools.find(x=>x.id===el.dataset.tdel);if(D.set.tools.filter(x=>!x.arch).length>1){tl.arch=true;changed();sheet();}return;}
  if(q('[data-addt]')){const v=C.clean($('ntlIn').value);if(v){D.set.tools.push({id:'t'+C.uid(),n:v});changed();sheet();}return;}
  if(q('[data-bkdl]')){download('hub-backup-'+today()+'.json',JSON.stringify(D),'application/json');return;}
  if(el=q('[data-bk]')){const m=el.dataset.bk,b=S.bk;S.bk=null;
    if(m!=='cancel'&&b){D=m==='merge'?C.merge(D,b):b;S.ops=[];S.slotKey=null;autoClass();changed();toast(m==='merge'?'دُمجت النسخة الاحتياطية':'استُبدلت البيانات بالنسخة الاحتياطية','info');}
    refresh();return;}
});
document.addEventListener('change',e=>{
  const t=e.target,ds=t.dataset;
  if(t.id==='imFile'){readFile(t,u8=>{S.im.text=C.decode(u8);if($('imTxt'))$('imTxt').value=S.im.text;buildPreview();refresh();});return;}
  if(t.id==='bkFile'){readFile(t,u8=>{let b=null;try{b=JSON.parse(C.decode(u8).replace(/^\ufeff/,''));}catch(x){}
    if(b&&b.v&&Array.isArray(b.classes)&&Array.isArray(b.students)&&Array.isArray(b.recs))S.bk=fix(b);else{S.bk=null;toast('هذا الملف ليس نسخة احتياطية من البرنامج','warn');}refresh();});return;}
  if(ds.cn){const c=D.classes.find(x=>x.id===ds.cn),v=C.clean(t.value);if(v){c.name=v;changed();}else t.value=c.name;return;}
  if(ds.sf){const s=stu(ds.id),v=C.clean(t.value);if(!v){t.value=s[ds.sf];return;}
    if(ds.sf==='full'){const auto=s.name===C.shortName(s.full);s.full=v;if(auto)s.name=C.shortName(v);}else s.name=v;
    changed();if(S.sheet&&S.sheet.t==='ros')sheet();return;}
  if(ds.pt){const[i,j]=ds.pt.split('-').map(Number);if(/^\d\d:\d\d$/.test(t.value)){D.periods[i][j]=t.value;S.slotKey=null;autoClass();changed();}return;}
  if(t.id==='otIn'){const v=C.clean(t.value);if(v){const o=D.set.other;D.set.other=v;D.tt.forEach(r=>r.forEach(c=>{if(c&&c.x===o)c.x=v;}));changed();sheet();}return;}
  if(ds.tn){const v=C.clean(t.value);if(v){D.set.tools.find(x=>x.id===ds.tn).n=v;changed();}return;}
  if(t.id==='setT'){D.set.teacher=C.clean(t.value);changed();return;}
  if(t.id==='setP'){const a=C.latin(t.value).split(/[,،\s]+/).map(x=>parseInt(x.replace('−','-'),10)).filter(n=>n&&Math.abs(n)<=100).slice(0,6);if(a.length){D.set.pts=a;S.pv=0;changed();}t.value=D.set.pts.join(', ');return;}
  if(t.id==='setR'){const a=t.value.split('\n').map(C.clean).filter(Boolean).slice(0,8);if(a.length){D.set.reasons=a;S.reason=0;changed();}t.value=D.set.reasons.join('\n');return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;S.ttEdit=false;sheet();}
  if(e.key==='Enter'&&e.target.id==='ntIn'){const b=document.querySelector('[data-note]');if(b)b.click();}});

/* ================= start ================= */
async function boot(){
  let local=null;try{local=JSON.parse(localStorage.getItem(LS)||'null');}catch(e){}
  if(local&&local.v)D=fix(local);
  if(!sv.fs)sv.state='nofs';
  else{try{sv.dir=await KV.get('dir')||null;}catch(e){sv.dir=null;}
    if(sv.dir){try{if(await sv.dir.queryPermission({mode:'readwrite'})==='granted')await attach();else sv.state='need';}catch(e){console.warn(e);sv.state='error';}}}
  document.body.classList.toggle('phone',PHONE);
  if(PHONE){if(!D.dev){D.dev=Math.random().toString(36).slice(2,5);persistLocal();}
    const old=C.addDays(today(),-21),n0=D.recs.length;D.recs=D.recs.filter(r=>!(r.sent&&r.d<old));if(D.recs.length!==n0)persistLocal();}
  else C.number(D);
  autoClass();render();marker();lessonSync();checkBook();setInterval(tick,20000);addEventListener('focus',checkBook);
  if(!PHONE&&!('BarcodeDetector' in window))ensureJsQR().then(()=>{S.jsq='ready';},()=>{S.jsq='fail';}).then(()=>{if(S.sheet&&S.sheet.t==='ph')sheet();});
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
  window.HUB={LK,get data(){return D;},S,sv,changed,rx,PHONE,get frames(){return qr&&qr.fr;},kv:{get:kvGet,set:kvSet},ready:true};
}
boot();
})();
